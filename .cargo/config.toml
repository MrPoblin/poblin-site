# wasm-bindgen's catch wrappers need an externref table and it refuses to build
# without reference-types, which wasm32-unknown-unknown does not enable by default
# ("externref table required for catch wrappers"). Kept here rather than in
# RUSTFLAGS so the setting travels with the repo.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+reference-types"]
