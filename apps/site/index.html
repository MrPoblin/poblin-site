<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <meta name="theme-color" content="#0a2660" />
    <title>Poblin</title>
    <meta name="description" content="Poblin's bio page" />
    <link rel="canonical" href="https://poblin.live/" />

    <!-- Link previews. The image is the existing sun asset, not a generated card,
         and it is square - which is why this is the compact `summary` card rather
         than `summary_large_image`, which would crop it to 1.91:1. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poblin" />
    <meta property="og:title" content="Poblin" />
    <meta property="og:description" content="Poblin's bio page" />
    <meta property="og:url" content="https://poblin.live/" />
    <meta property="og:image" content="https://poblin.live/assets/poblin-sun.webp" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Poblin" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
