name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Security advisories appear independently of our commits, so the Rust advisory
  # scan runs on a timer rather than gating unrelated pull requests on a disclosure
  # we did not cause and cannot fix in the same change.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA. A tag is mutable, and a compromised action
      # runs with the workflow's token; a SHA cannot be moved.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the primary supply-chain control: what runs is what was
      # reviewed, and a resolution that drifts fails instead of silently passing.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The root scripts are what a developer runs, and CI runs the same entry point
      # rather than a recursive form that could drift from it.
      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --audit-level high --prod

  rust:
    name: rust
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      # The cargo home is relocated into the workspace so the cache keys below
      # hold repo-relative paths; nothing on the runner's own home is named.
      - name: Put the cargo home's bin on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler and declares the components and the
      # wasm target. `rustup show` installs all of it, which is why this workflow
      # needs no third-party Rust setup action.
      - name: Install toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cargo/registry
            ${{ github.workspace }}/.cargo/git
            ${{ github.workspace }}/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      # Linted for the host and for wasm separately: the worker crate is compiled
      # for wasm32 in production, so linting it for the host would check a
      # configuration that never ships.
      - name: Clippy (core, host)
        run: cargo clippy -p poblin-core --all-targets -- -D warnings

      - name: Clippy (worker, wasm32)
        run: cargo clippy -p poblin-worker --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: cargo test -p poblin-core

      # --force because the cached cargo bin is restored below: a restore hands back
      # the previous run's binary and `cargo install` otherwise aborts with "binary
      # `worker-build` already exists in destination".
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.6 --locked --force

      # The point of Part 1 having a Worker crate at all: keep the Rust -> wasm
      # toolchain verified on every push, while the surface is one handler, rather
      # than discovering it is broken on the day an API route has to work.
      - name: Build worker to wasm
        run: worker-build --release
        working-directory: crates/worker

  advisory:
    name: rust advisories
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - name: Put the cargo home's bin on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cargo/registry
            ${{ github.workspace }}/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      # --force for the same reason as worker-build above.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      - name: Audit
        run: cargo audit
