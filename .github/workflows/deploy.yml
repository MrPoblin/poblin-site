name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job writes to Cloudflare, never to the repository.
permissions:
  contents: read

# Never cancel a deploy already in flight. A half-applied deploy is worse than a
# queued one, so this waits rather than interrupts.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Declaring the environment means protection rules (required reviewers, scoped
    # secrets) can be attached later without editing this file. Repository secrets
    # are visible here either way.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deploying something that does not typecheck or build is the failure this
      # workflow exists to prevent, so both run before wrangler is invoked.
      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Assemble asset root
        run: pnpm assemble

      # wrangler is an exactly-pinned devDependency, so this uses the version in
      # pnpm-lock.yaml rather than an action carrying its own separate pin.
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
